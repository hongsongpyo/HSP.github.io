<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Performance | Songpyo Hong</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050505;
      --text: #f5f1eb;
      --accent: #ff7a1a;
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      height: 100%;
      font-family: "Noto Sans KR", sans-serif;
      background:
        linear-gradient(120deg, rgba(0,0,0,0.66), rgba(0,0,0,0.30)),
        url("Images/performance/orchestra-bg.JPG") center center / cover no-repeat;
      color: var(--text);
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.05;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 5px 5px;
      mix-blend-mode: soft-light;
      z-index: 1;
    }

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      background: transparent;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-main {
      font-size: 0.96rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #f5f1eb;
    }

    .brand-sub {
      font-size: 0.66rem;
      color: var(--accent);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .top-nav a {
      position: relative;
      font-size: 0.88rem;
      font-weight: 600;
      color: rgba(255,255,255,0.88);
      transition: color 0.25s ease;
    }

    .top-nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -8px;
      width: 0;
      height: 1px;
      background: var(--accent);
      transition: width 0.25s ease;
    }

    .top-nav a:hover {
      color: var(--accent);
    }

    .top-nav a:hover::after,
    .top-nav a.active::after {
      width: 100%;
    }

    .top-nav a.active {
      color: #ffffff;
    }

    .performance-page {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .performance-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.06) 0%, rgba(0,0,0,0.11) 55%, rgba(5,5,5,0.30) 100%);
      z-index: 2;
      pointer-events: none;
    }

    .performance-hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 94px 20px 24px;
      z-index: 5;
    }

    .performance-panel {
      position: relative;
      width: min(1540px, calc(100vw - 64px));
      height: min(790px, calc(100vh - 120px));
      min-height: 640px;
      background: rgba(255,255,255,0.012);
      border: 1px solid rgba(255,255,255,0.05);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.14);
      overflow: hidden;
    }

    .performance-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(255, 122, 26, 0.04), transparent 24%),
        linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0.008));
      pointer-events: none;
    }

    .stage-shell-wrap {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(1390px, 97%);
      height: 87%;
      z-index: 4;
    }

    .stage-shell {
      position: absolute;
      inset: 0;
    }

    .stage-shell::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 98.8%;
      height: 95%;
      border: 3px solid rgba(255, 122, 26, 0.9);
      border-bottom: none;
      border-top-left-radius: 9999px;
      border-top-right-radius: 9999px;
      background: transparent;
      box-shadow: 0 0 24px rgba(255, 122, 26, 0.07);
    }

    .stage-shell::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 98.8%;
      border-top: 3px solid rgba(255, 122, 26, 0.9);
      box-shadow: 0 0 24px rgba(255, 122, 26, 0.05);
    }

    .section-link {
      position: absolute;
      display: block;
      z-index: 3;
      transform-origin: center center;
      transition: transform 0.28s ease;
    }

    .section-link:hover {
      transform: translateX(-50%) scale(1.05);
    }

    .section-link.left-group:hover,
    .section-link.right-group:hover {
      transform: scale(1.05);
    }

    .section-link.profile-link:hover {
      transform: translateX(-50%) scale(1.06);
    }

    .seat-rows {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .seat-row {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .seat-row.offset-1 { padding-left: 18px; }
    .seat-row.offset-2 { padding-left: 36px; }
    .seat-row.offset-3 { padding-left: 54px; }

    .seat {
      width: 54px;
      height: 24px;
      border-radius: 5px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      box-shadow:
        0 6px 18px rgba(0,0,0,0.18),
        inset 0 1px 0 rgba(255,255,255,0.15);
      transition:
        background 0.28s ease,
        border-color 0.28s ease,
        transform 0.28s ease;
    }

    .section-link:hover .seat {
      background: rgba(255, 122, 26, 0.20);
      border-color: rgba(255, 122, 26, 0.44);
    }

    .section-label {
      margin-top: 14px;
      text-align: center;
      font-family: "Playfair Display", serif;
      font-size: 1.34rem;
      color: var(--text);
      text-shadow: 0 4px 16px rgba(0,0,0,0.35);
      letter-spacing: 0.01em;
    }

    .section-link.profile-link {
      left: 50%;
      bottom: 7%;
      transform: translateX(-50%);
      width: 154px;
      height: 154px;
      border-radius: 50%;
      overflow: hidden;
      background: rgba(255, 122, 26, 0.08);
      border: 2px solid rgba(255, 122, 26, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.14);
      transition: transform 0.28s ease, border-color 0.28s ease, box-shadow 0.28s ease;
    }

    .section-link.profile-link:hover {
      border-color: rgba(255, 122, 26, 1);
      box-shadow: 0 0 0 6px rgba(255, 122, 26, 0.10), 0 8px 24px rgba(0,0,0,0.18);
    }

    .profile-photo {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0.38)),
        url("Images/performance/profile.JPG") center center / cover no-repeat;
    }

    .profile-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      text-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .profile-text strong {
      font-family: "Playfair Display", serif;
      font-size: 1.34rem;
      line-height: 1;
      font-weight: 700;
    }

    .profile-text span {
      margin-top: 5px;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.88);
    }

    .seat-concert {
      left: 50%;
      top: 14%;
      transform: translateX(-50%);
    }

    .seat-photo {
      left: 17%;
      bottom: 43%;
    }

    .seat-youtube {
      left: 3.8%;
      bottom: 18%;
    }

    .seat-sheet {
      right: 17%;
      bottom: 43%;
    }

    .seat-hidden {
      right: 3.8%;
      bottom: 18%;
    }

    .hidden-label {
      display: block;
      margin-top: 14px;
      text-align: center;
      font-family: "Playfair Display", serif;
      font-size: 1.18rem;
      color: transparent;
      text-shadow: none;
      letter-spacing: 0.01em;
      pointer-events: none;
      user-select: none;
    }

    @media (max-width: 1280px) {
      .performance-panel {
        width: min(98vw, 1540px);
      }

      .section-link.profile-link {
        width: 136px;
        height: 136px;
      }

      .seat {
        width: 48px;
        height: 22px;
      }

      .seat-row {
        gap: 9px;
      }

      .seat-rows {
        gap: 9px;
      }

      .seat-row.offset-1 { padding-left: 16px; }
      .seat-row.offset-2 { padding-left: 30px; }
      .seat-row.offset-3 { padding-left: 46px; }
    }

    @media (max-width: 1024px) {
      .seat-photo { left: 13%; bottom: 40%; }
      .seat-sheet { right: 13%; bottom: 40%; }
      .seat-youtube { left: 1.5%; bottom: 18%; }
      .seat-hidden { right: 1.5%; bottom: 18%; }

      .section-label {
        font-size: 1.12rem;
      }

      .hidden-label {
        font-size: 1rem;
      }

      .seat {
        width: 40px;
        height: 19px;
      }

      .seat-row.offset-1 { padding-left: 14px; }
      .seat-row.offset-2 { padding-left: 24px; }
      .seat-row.offset-3 { padding-left: 38px; }
    }

    @media (max-width: 900px) {
      .site-header {
        padding: 16px 16px;
        flex-direction: column;
        gap: 10px;
      }

      .brand-main {
        font-size: 0.9rem;
      }

      .brand-sub {
        font-size: 0.6rem;
      }

      .top-nav {
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .top-nav a {
        font-size: 0.8rem;
      }

      .performance-hero {
        padding: 102px 10px 18px;
      }

      .performance-panel {
        width: 97vw;
        height: min(720px, calc(100vh - 128px));
        min-height: 540px;
      }

      .section-label {
        font-size: 0.98rem;
        margin-top: 10px;
      }

      .hidden-label {
        font-size: 0.9rem;
        margin-top: 10px;
      }

      .section-link.profile-link {
        width: 110px;
        height: 110px;
      }

      .profile-text strong {
        font-size: 1rem;
      }

      .profile-text span {
        font-size: 0.5rem;
      }

      .seat {
        width: 32px;
        height: 16px;
      }

      .seat-row,
      .seat-rows {
        gap: 7px;
      }

      .seat-row.offset-1 { padding-left: 8px; }
      .seat-row.offset-2 { padding-left: 14px; }
      .seat-row.offset-3 { padding-left: 20px; }

      .seat-concert { top: 18%; }
      .seat-photo   { left: 11%; bottom: 41%; }
      .seat-sheet   { right: 11%; bottom: 41%; }
      .seat-youtube { left: 1%; bottom: 20%; }
      .seat-hidden  { right: 1%; bottom: 20%; }
    }

    @media (max-width: 640px) {
      .performance-panel {
        height: min(700px, calc(100vh - 120px));
        min-height: 500px;
      }

      .seat {
        width: 24px;
        height: 13px;
        border-radius: 4px;
      }

      .section-label {
        font-size: 0.82rem;
      }

      .hidden-label {
        font-size: 0.74rem;
      }

      .seat-concert { top: 20%; }
      .seat-photo   { left: 7%; bottom: 41%; }
      .seat-sheet   { right: 7%; bottom: 41%; }
      .seat-youtube { left: 0; bottom: 21%; }
      .seat-hidden  { right: 0; bottom: 21%; }

      .section-link.profile-link {
        width: 92px;
        height: 92px;
      }
    }
  </style>
</head>
<body>
  <div class="noise"></div>

  <header class="site-header">
    <div class="brand">
      <a href="index.html" class="brand-main">Songpyo Hong</a>
      <span class="brand-sub">Performance</span>
    </div>

    <nav class="top-nav">
      <a href="performance.html" class="active">Performance</a>
      <a href="research.html">Research</a>
    </nav>
  </header>

  <div class="performance-page">
    <div class="performance-overlay"></div>

    <main class="performance-hero">
      <section class="performance-panel">
        <div class="stage-shell-wrap">
          <div class="stage-shell">

            <a href="performance-concert.html" class="section-link seat-concert" aria-label="Concert page">
              <div class="seat-rows">
                <div class="seat-row offset-2">
                  <span class="seat"></span><span class="seat"></span><span class="seat"></span>
                </div>
                <div class="seat-row offset-1">
                  <span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span>
                </div>
                <div class="seat-row">
                  <span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span>
                </div>
              </div>
              <div class="section-label">Concert</div>
            </a>

            <a href="performance-photo.html" class="section-link left-group seat-photo" aria-label="Photo page">
              <div class="seat-rows">
                <div class="seat-row offset-2">
                  <span class="seat"></span><span class="seat"></span><span class="seat"></span>
                </div>
                <div class="seat-row offset-1">
                  <span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span>
                </div>
                <div class="seat-row">
                  <span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span>
                </div>
              </div>
              <div class="section-label">Photo</div>
            </a>

            <a href="performance-youtube.html" class="section-link left-group seat-youtube" aria-label="Youtube page">
              <div class="seat-rows">
                <div class="seat-row offset-3">
                  <span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span>
                </div>
                <div class="seat-row offset-2">
                  <span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span>
                </div>
                <div class="seat-row offset-1">
                  <span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span>
                </div>
              </div>
              <div class="section-label">Youtube</div>
            </a>

            <a href="performance-sheet.html" class="section-link right-group seat-sheet" aria-label="Sheet page">
              <div class="seat-rows">
                <div class="seat-row offset-2">
                  <span class="seat"></span><span class="seat"></span><span class="seat"></span>
                </div>
                <div class="seat-row offset-1">
                  <span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span>
                </div>
                <div class="seat-row">
                  <span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span>
                </div>
              </div>
              <div class="section-label">Sheet</div>
            </a>

            <a href="performance-easteregg.html" class="section-link right-group seat-hidden" aria-label="Hidden page">
              <div class="seat-rows">
                <div class="seat-row offset-3">
                  <span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span>
                </div>
                <div class="seat-row offset-2">
                  <span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span>
                </div>
                <div class="seat-row offset-1">
                  <span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span>
                </div>
              </div>
              <div class="hidden-label">Hidden</div>
            </a>

            <a href="performance-profile.html" class="section-link profile-link" aria-label="Profile page">
              <div class="profile-photo"></div>
              <div class="profile-text">
                <strong>Profile</strong>
                <span>Songpyo Hong</span>
              </div>
            </a>

          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
