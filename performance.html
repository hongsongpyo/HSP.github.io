<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Performance | Songpyo Hong</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --text: #f5f1eb;
      --accent: #ff7a1a;
      --seat-light: rgba(180, 180, 180, 0.36);
      --seat-mid: rgba(120, 120, 120, 0.42);
      --seat-dark: rgba(78, 78, 78, 0.50);
      --seat-border: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      height: 100%;
      font-family: "Noto Sans KR", sans-serif;
      background:
        linear-gradient(120deg, rgba(0,0,0,0.66), rgba(0,0,0,0.30)),
        url("Images/performance/orchestra-bg.jpg") center center / cover no-repeat;
      color: var(--text);
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.05;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 5px 5px;
      mix-blend-mode: soft-light;
      z-index: 1;
    }

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      background: transparent;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-main {
      font-size: 0.96rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #f5f1eb;
    }

    .brand-sub {
      font-size: 0.66rem;
      color: var(--accent);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .top-nav a {
      position: relative;
      font-size: 0.88rem;
      font-weight: 600;
      color: rgba(255,255,255,0.88);
      transition: color 0.25s ease;
    }

    .top-nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -8px;
      width: 0;
      height: 1px;
      background: var(--accent);
      transition: width 0.25s ease;
    }

    .top-nav a:hover {
      color: var(--accent);
    }

    .top-nav a:hover::after,
    .top-nav a.active::after {
      width: 100%;
    }

    .top-nav a.active {
      color: #ffffff;
    }

    .performance-page {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .performance-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.06) 0%, rgba(0,0,0,0.11) 55%, rgba(5,5,5,0.30) 100%);
      z-index: 2;
      pointer-events: none;
    }

    .performance-hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 94px 20px 24px;
      z-index: 5;
    }

    .performance-panel {
      position: relative;
      width: min(1560px, calc(100vw - 56px));
      height: min(800px, calc(100vh - 116px));
      min-height: 650px;
      background: rgba(255,255,255,0.012);
      border: 1px solid rgba(255,255,255,0.05);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.14);
      overflow: hidden;
    }

    .performance-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(255, 122, 26, 0.04), transparent 24%),
        linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0.008));
      pointer-events: none;
    }

    .stage-shell-wrap {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(1410px, 97.5%);
      height: 87%;
      z-index: 4;
    }

    .stage-shell {
      position: absolute;
      inset: 0;
    }

    .stage-shell::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 99%;
      height: 95%;
      border: 3px solid rgba(255, 122, 26, 0.92);
      border-bottom: none;
      border-top-left-radius: 9999px;
      border-top-right-radius: 9999px;
      background: transparent;
      box-shadow: 0 0 24px rgba(255, 122, 26, 0.08);
    }

    .stage-shell::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 99%;
      border-top: 3px solid rgba(255, 122, 26, 0.92);
      box-shadow: 0 0 24px rgba(255, 122, 26, 0.05);
    }

    .section-link {
      position: absolute;
      display: block;
      z-index: 3;
      transform-origin: center center;
      transition: transform 0.28s ease, filter 0.28s ease;
    }

    .section-link:hover {
      transform: scale(1.05);
      filter: brightness(1.05);
    }

    .section-link.profile-link:hover {
      transform: translateX(-50%) scale(1.06);
    }

    .seats-wrap {
      display: flex;
      flex-direction: column;
      gap: 9px;
      align-items: center;
    }

    .seat-row {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .seat-row.shift-1 { margin-left: 14px; }
    .seat-row.shift-2 { margin-left: 28px; }
    .seat-row.shift-3 { margin-left: 42px; }

    .seat {
      width: 58px;
      height: 24px;
      border-radius: 4px;
      border: 1px solid var(--seat-border);
      box-shadow: 0 8px 24px rgba(0,0,0,0.10);
      transition: background 0.28s ease, border-color 0.28s ease;
    }

    .tone-light .seat { background: var(--seat-light); }
    .tone-mid .seat { background: var(--seat-mid); }
    .tone-dark .seat { background: var(--seat-dark); }

    .section-link:hover .seat {
      border-color: rgba(255, 122, 26, 0.44);
      background: rgba(255, 122, 26, 0.20);
    }

    .section-label {
      margin-top: 12px;
      text-align: center;
      font-family: "Playfair Display", serif;
      font-size: 1.28rem;
      color: var(--text);
      text-shadow: 0 4px 16px rgba(0,0,0,0.35);
      letter-spacing: 0.01em;
    }

    .rotate-left-sm  { transform: rotate(-18deg); }
    .rotate-left-md  { transform: rotate(-28deg); }
    .rotate-right-sm { transform: rotate(18deg); }
    .rotate-right-md { transform: rotate(28deg); }

    .section-link:hover .rotate-left-sm,
    .section-link:hover .rotate-left-md,
    .section-link:hover .rotate-right-sm,
    .section-link:hover .rotate-right-md {
      transform-origin: center center;
    }

    .profile-link {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      width: 156px;
      height: 156px;
      border-radius: 50%;
      overflow: hidden;
      background: rgba(255, 122, 26, 0.08);
      border: 2px solid rgba(255, 122, 26, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.14);
      transition: transform 0.28s ease, border-color 0.28s ease, box-shadow 0.28s ease;
      z-index: 5;
    }

    .profile-link:hover {
      border-color: rgba(255, 122, 26, 1);
      box-shadow: 0 0 0 6px rgba(255, 122, 26, 0.10), 0 8px 24px rgba(0,0,0,0.18);
    }

    .profile-photo {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0.38)),
        url("Images/performance/profile.jpg") center center / cover no-repeat;
    }

    .profile-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      text-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .profile-text strong {
      font-family: "Playfair Display", serif;
      font-size: 1.34rem;
      line-height: 1;
      font-weight: 700;
    }

    .profile-text span {
      margin-top: 5px;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.88);
    }

    /* placement based on uploaded arrangement */
    .seat-concert {
      left: 50%;
      top: 12%;
      transform: translateX(-50%);
    }

    .seat-photo {
      left: 25.5%;
      bottom: 32.5%;
    }

    .seat-youtube {
      left: 8.5%;
      bottom: 13.5%;
    }

    .seat-sheet {
      right: 26%;
      bottom: 33%;
    }

    .seat-hidden {
      right: 7.2%;
      bottom: 13.8%;
    }

    .hidden-label {
      display: none;
    }

    @media (max-width: 1280px) {
      .performance-panel {
        width: min(98vw, 1560px);
      }

      .profile-link {
        width: 138px;
        height: 138px;
      }

      .seat {
        width: 50px;
        height: 22px;
      }

      .seat-row {
        gap: 8px;
      }

      .seats-wrap {
        gap: 8px;
      }

      .section-label {
        font-size: 1.12rem;
      }
    }

    @media (max-width: 1024px) {
      .seat {
        width: 42px;
        height: 19px;
      }

      .seat-photo { left: 22.5%; }
      .seat-sheet { right: 23%; }
      .seat-youtube { left: 5%; }
      .seat-hidden { right: 4.2%; }

      .section-label {
        font-size: 1rem;
      }
    }

    @media (max-width: 900px) {
      .site-header {
        padding: 16px 16px;
        flex-direction: column;
        gap: 10px;
      }

      .brand-main {
        font-size: 0.9rem;
      }

      .brand-sub {
        font-size: 0.6rem;
      }

      .top-nav {
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .top-nav a {
        font-size: 0.8rem;
      }

      .performance-hero {
        padding: 102px 10px 18px;
      }

      .performance-panel {
        width: 97vw;
        height: min(720px, calc(100vh - 128px));
        min-height: 540px;
      }

      .profile-link {
        width: 112px;
        height: 112px;
      }

      .profile-text strong {
        font-size: 1rem;
      }

      .profile-text span {
        font-size: 0.5rem;
      }

      .seat {
        width: 34px;
        height: 16px;
      }

      .seat-row {
        gap: 6px;
      }

      .seats-wrap {
        gap: 6px;
      }

      .section-label {
        font-size: 0.86rem;
        margin-top: 9px;
      }

      .seat-concert { top: 16%; }
      .seat-photo { left: 21%; bottom: 34%; }
      .seat-youtube { left: 4%; bottom: 16%; }
      .seat-sheet { right: 21%; bottom: 34%; }
      .seat-hidden { right: 3%; bottom: 16%; }
    }

    @media (max-width: 640px) {
      .seat {
        width: 24px;
        height: 12px;
        border-radius: 3px;
      }

      .profile-link {
        width: 94px;
        height: 94px;
      }

      .section-label {
        font-size: 0.74rem;
      }

      .seat-concert { top: 18%; }
      .seat-photo { left: 16%; bottom: 35%; }
      .seat-youtube { left: 1%; bottom: 18%; }
      .seat-sheet { right: 16%; bottom: 35%; }
      .seat-hidden { right: 0; bottom: 18%; }
    }
  </style>
</head>
<body>

            <!-- Sheet : viola cluster -->
            <a href="performance-sheet.html" class="section-link tone-light seat-sheet" aria-label="Sheet page">
              <div class="seats-wrap">
                <div class="seat-row rotate-right-sm">
                  <span class="seat"></span>

                <div class="seat-row rotate-right-md">

            <!-- Hidden : cello + bass merged -->

</html>
