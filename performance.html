<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Performance | Songpyo Hong</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050505;
      --bg-soft: #0d0d0f;
      --panel: rgba(255, 255, 255, 0.05);
      --panel-strong: rgba(255, 255, 255, 0.10);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f5f1eb;
      --muted: #d2c7bd;
      --accent: #ff7a1a;
      --shadow: 0 20px 80px rgba(0, 0, 0, 0.35);
      --glass-blur: blur(14px);
      --max: 1200px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      height: 100%;
      font-family: "Noto Sans KR", sans-serif;
      background:
        linear-gradient(120deg, rgba(0,0,0,0.66), rgba(0,0,0,0.30)),
        url("Images/PERFORMANCE/orchestra-bg.jpg") center center / cover no-repeat;
      color: var(--text);
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.05;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 5px 5px;
      mix-blend-mode: soft-light;
      z-index: 1;
    }

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      background: transparent;
      border-bottom: none;
      backdrop-filter: none;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-main {
      font-size: 0.96rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #f5f1eb;
    }

    .brand-sub {
      font-size: 0.66rem;
      color: var(--accent);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .top-nav a {
      position: relative;
      font-size: 0.88rem;
      font-weight: 600;
      color: rgba(255,255,255,0.88);
      transition: color 0.25s ease;
    }

    .top-nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -8px;
      width: 0;
      height: 1px;
      background: var(--accent);
      transition: width 0.25s ease;
    }

    .top-nav a:hover {
      color: var(--accent);
    }

    .top-nav a:hover::after,
    .top-nav a.active::after {
      width: 100%;
    }

    .top-nav a.active {
      color: #ffffff;
    }

    .performance-page {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .performance-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0.18) 55%, rgba(5,5,5,0.38) 100%);
      z-index: 2;
      pointer-events: none;
    }

    .performance-hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 28px 60px;
      z-index: 5;
    }

    .performance-panel {
      position: relative;
      width: min(1320px, calc(100vw - 120px));
      height: min(720px, calc(100vh - 180px));
      min-height: 580px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.14);
      overflow: hidden;
    }

    .performance-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(255, 122, 26, 0.06), transparent 24%),
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      pointer-events: none;
    }

    .panel-copy {
      position: absolute;
      top: 38px;
      left: 46px;
      z-index: 6;
      max-width: 430px;
    }

    .panel-copy h1 {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 0;
    }

    .english-name {
      font-family: "Playfair Display", serif;
      font-size: clamp(3rem, 5vw, 5rem);
      color: #f0dfcf;
      line-height: 0.95;
    }

    .role {
      margin: 8px 0 0;
      font-size: 0.94rem;
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
    }

    .stage-shell-wrap {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: min(1080px, 88%);
      height: 74%;
      z-index: 4;
    }

    .stage-shell {
      position: absolute;
      inset: 0;
    }

    .stage-shell::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 92%;
      height: 90%;
      border: 2px solid rgba(255, 122, 26, 0.72);
      border-bottom: none;
      border-top-left-radius: 1000px;
      border-top-right-radius: 1000px;
      background: transparent;
    }

    .stage-shell::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 92%;
      border-top: 2px solid rgba(255, 122, 26, 0.72);
    }

    .section-link {
      position: absolute;
      display: block;
      z-index: 3;
      transition: transform 0.28s ease;
    }

    .section-link:hover {
      transform: scale(1.05);
    }

    .section-link.profile-link:hover {
      transform: translateX(-50%) scale(1.05);
    }

    .seat-grid {
      display: grid;
      gap: 10px;
      justify-content: center;
      align-content: center;
    }

    .seat-grid.cols-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    .seat-grid.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .seat-grid.cols-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .seat {
      width: 48px;
      height: 22px;
      border-radius: 4px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 8px 24px rgba(0,0,0,0.10);
      transition: background 0.28s ease, border-color 0.28s ease;
    }

    .section-link:hover .seat {
      background: rgba(255, 122, 26, 0.18);
      border-color: rgba(255, 122, 26, 0.40);
    }

    .section-label {
      margin-top: 12px;
      text-align: center;
      font-family: "Playfair Display", serif;
      font-size: 1.2rem;
      color: var(--text);
      text-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }

    .section-link.profile-link {
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      width: 138px;
      height: 138px;
      border-radius: 50%;
      overflow: hidden;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.14);
      transition: transform 0.28s ease, border-color 0.28s ease;
    }

    .section-link.profile-link:hover {
      border-color: rgba(255, 122, 26, 0.40);
    }

    .profile-photo {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0.38)),
        url("Images/PERFORMANCE/profile.jpg") center center / cover no-repeat;
    }

    .profile-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      text-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .profile-text strong {
      font-family: "Playfair Display", serif;
      font-size: 1.3rem;
      line-height: 1;
      font-weight: 700;
    }

    .profile-text span {
      margin-top: 5px;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.88);
    }

    .seat-perc {
      left: 50%;
      top: 7%;
      transform: translateX(-50%);
    }

    .seat-winds {
      left: 50%;
      top: 21%;
      transform: translateX(-50%);
    }

    .seat-second {
      left: 23%;
      bottom: 34%;
    }

    .seat-first {
      left: 9%;
      bottom: 16%;
    }

    .seat-viola {
      right: 25%;
      bottom: 34%;
    }

    .seat-cello {
      right: 11%;
      bottom: 16%;
    }

    @media (max-width: 1200px) {
      .performance-panel {
        width: min(96vw, 1320px);
      }

      .section-link.profile-link {
        width: 122px;
        height: 122px;
      }

      .seat {
        width: 42px;
        height: 20px;
      }
    }

    @media (max-width: 900px) {
      .site-header {
        padding: 16px 16px;
        flex-direction: column;
        gap: 10px;
      }

      .brand-main {
        font-size: 0.9rem;
      }

      .brand-sub {
        font-size: 0.6rem;
      }

      .top-nav {
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .top-nav a {
        font-size: 0.8rem;
      }

      .performance-hero {
        padding: 100px 18px 40px;
      }

      .performance-panel {
        width: 94vw;
        height: min(700px, calc(100vh - 170px));
        min-height: 520px;
      }

      .panel-copy {
        top: 24px;
        left: 24px;
      }

      .english-name {
        font-size: clamp(2.4rem, 9vw, 3.4rem);
      }

      .role {
        font-size: 0.8rem;
      }

      .section-label {
        font-size: 0.94rem;
      }

      .section-link.profile-link {
        width: 98px;
        height: 98px;
      }

      .profile-text strong {
        font-size: 0.98rem;
      }

      .profile-text span {
        font-size: 0.5rem;
      }

      .seat {
        width: 32px;
        height: 16px;
        gap: 8px;
      }

      .seat-grid {
        gap: 8px;
      }
    }

    @media (max-width: 640px) {
      .seat-first {
        left: 1%;
        bottom: 17%;
      }

      .seat-second {
        left: 15%;
        bottom: 35%;
      }

      .seat-viola {
        right: 17%;
        bottom: 35%;
      }

      .seat-cello {
        right: 1%;
        bottom: 17%;
      }

      .seat-winds {
        top: 24%;
      }

      .seat-perc {
        top: 10%;
      }

      .section-label {
        font-size: 0.82rem;
      }
    }
  </style>
</head>
<body>
  <div class="noise"></div>

  <header class="site-header">
    <div class="brand">
      <a href="index.html" class="brand-main">Songpyo Hong</a>
      <span class="brand-sub">Performance</span>
    </div>

    <nav class="top-nav">
      <a href="performance.html" class="active">Performance</a>
      <a href="research.html">Research</a>
    </nav>
  </header>

  <div class="performance-page">
    <div class="performance-overlay"></div>

    <main class="performance-hero">
      <section class="performance-panel">
        <div class="panel-copy">
          <h1>
            <span class="english-name">Songpyo Hong</span>
          </h1>
          <p class="role">Performance</p>
        </div>

        <div class="stage-shell-wrap">
          <div class="stage-shell">

            <a href="performance-percussion.html" class="section-link seat-perc" aria-label="Percussion page">
              <div class="seat-grid cols-2">
                <span class="seat"></span>
                <span class="seat"></span>
              </div>
              <div class="section-label">Percussion</div>
            </a>

            <a href="performance-winds.html" class="section-link seat-winds" aria-label="Woodwinds and Brass page">
              <div class="seat-grid cols-4">
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
              </div>
              <div class="section-label">Performances</div>
            </a>

            <a href="performance-second-violin.html" class="section-link seat-second" aria-label="Second section page">
              <div class="seat-grid cols-3">
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
              </div>
              <div class="section-label">Performances</div>
            </a>

            <a href="performance-first-violin.html" class="section-link seat-first" aria-label="First section page">
              <div class="seat-grid cols-4">
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
              </div>
              <div class="section-label">Performances</div>
            </a>

            <a href="performance-viola.html" class="section-link seat-viola" aria-label="Scores page">
              <div class="seat-grid cols-3">
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
              </div>
              <div class="section-label">Scores</div>
            </a>

            <a href="performance-cello.html" class="section-link seat-cello" aria-label="Photos page">
              <div class="seat-grid cols-4">
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
                <span class="seat"></span>
              </div>
              <div class="section-label">Photos</div>
            </a>

            <a href="performance-profile.html" class="section-link profile-link" aria-label="Profile page">
              <div class="profile-photo"></div>
              <div class="profile-text">
                <strong>Profile</strong>
                <span>Songpyo Hong</span>
              </div>
            </a>

          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
